<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2B"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#253248" stroke-width="6"/>

  <!-- Golden Crown & Film Icon -->
  <g transform="translate(106, 116)">
    <!-- Clapperboard top / crown base -->
    <path d="M40 240 L260 240 L280 100 L210 160 L150 60 L90 160 L20 100 Z" fill="url(#gold)" filter="drop-shadow(0px 8px 16px rgba(255,184,0,0.35))"/>
    
    <!-- Camera lens / Play circle in center -->
    <circle cx="150" cy="200" r="35" fill="#0B0E14"/>
    <polygon points="142,185 168,200 142,215" fill="#FFB800"/>
  </g>

  <!-- Brand lettering -->
  <text x="256" y="420" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">CREATE &amp; EARN</text>
  <text x="256" y="455" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#FFB800" text-anchor="middle" letter-spacing="2">CREATE. CONNECT. EARN.</text>
</svg>
